[workspace]
resolver = "2"
exclude = ["agix"]
members = [
    "crates/app",
    "crates/instance",
    "crates/authz",
    "crates/builtin",
    "crates/contract",
    "crates/harnix",
    "crates/hub",
    "crates/module",
    "crates/testapp",
    "crates/transport",
]

# No `[workspace.package]`: each crate states its own version, licence,
# edition and toolchain floor. An application takes these crates in as members
# of *its* workspace (docs/harnix-0.4-design-and-plan.md §11.2), and anything
# inherited from a workspace would then be the application's — its licence
# included. `scripts/set-version.sh` changes the version everywhere at once;
# `tests/crate-metadata.mjs` checks they agree. The toolchain floor, 1.87, is
# what `script-host` (the QuickJS carrier, on in `daemon`'s defaults) needs.

# ──────────────────────────────────────────────
# Harnix's own crates
#
# The dependency direction is one-way and each layer is ignorant of the one
# above it; `tests/layering.rs` asserts it rather than leaving it to review.
#
#   app ─→ transport ─→ authz ─┐
#     └───→ builtin ──→ hub ────┴─→ contract        (pure types, no deps)
#                        └────→ instance → Agix
#   module ─→ instance, authz, contract
# ──────────────────────────────────────────────
[workspace.dependencies]
harnix           = { path = "crates/harnix" }
harnix-app       = { path = "crates/app" }
harnix-instance  = { path = "crates/instance" }
harnix-authz     = { path = "crates/authz" }
harnix-builtin   = { path = "crates/builtin" }
harnix-contract  = { path = "crates/contract" }
harnix-module    = { path = "crates/module" }
harnix-hub       = { path = "crates/hub" }
harnix-transport = { path = "crates/transport" }

# ──────────────────────────────────────────────
# Agix (submodule at agix/)
#
# Linked in-process, as path dependencies — but **not** members of this
# workspace (`exclude` above). Each Agix crate resolves its own
# `xxx = { workspace = true }` against Agix's own Cargo.toml, so this file does
# not mirror Agix's dependency table and Agix adding a dependency needs no
# change here. Only the entry crates Harnix's crates name directly are listed.
#
# `daemon` keeps its default features: the QuickJS script carrier (~1 MB) and
# the package layer. The plugin carrier (wasmtime, ~20 MB) is deliberately not
# built; Agix's own table already turns it off by default. Extension
# execution is Agix's; Harnix links no interpreter of its own.
# ──────────────────────────────────────────────
daemon    = { path = "agix/daemon" }
base      = { path = "agix/crates/core" }
model     = { path = "agix/crates/model" }
history   = { path = "agix/crates/history" }
scene     = { path = "agix/crates/scene" }
telemetry = { path = "agix/crates/telemetry" }
runtime   = { path = "agix/crates/runtime" }

# ──────────────────────────────────────────────
# Third-party — what Harnix's own crates use.
# ──────────────────────────────────────────────
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
bytes = "1"
axum = { version = "0.8", features = ["ws"] }
# TLS for the listener. rustls is already in the graph via reqwest, so the
# marginal cost against the binary-size budget is small.
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# Signature verification for device challenge-response. Already in the graph
# under rustls, so this declares what is linked rather than adding to it.
ring = "0.17"
include_dir = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
ignore = "0.4"
toml = "0.8"
clap = { version = "4", features = ["derive", "string"] }
tempfile = "3"
# Only under harnix-contract's `ts` feature — see crates/contract/Cargo.toml.
ts-rs = { version = "12", default-features = false, features = ["serde-compat"] }

# Agix's release profile — see its Cargo.toml for why `panic` stays
# `unwind` and `lto` stays `thin`. A profile only applies at the workspace
# root, so this is not inherited from Agix and has to be written here. The binary-size budget in
# docs/concept_and_architecture.md §7.2 is measured against this profile.
[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
