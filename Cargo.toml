[workspace]
resolver = "2"
members = [
    "crates/app",
    "crates/assembly",
    "crates/authz",
    "crates/builtin",
    "crates/contract",
    "crates/contrib",
    "crates/hub",
    "crates/transport",
]

[workspace.package]
version = "0.3.1-2026102501"
edition = "2021"
# `script-host` (the QuickJS carrier, on by default — see the `daemon` entry
# below) needs 1.87. The floor is the whole graph's, so it is declared here
# rather than discovered at link time.
rust-version = "1.87"
license = "Apache-2.0"
publish = false
authors = ["Harnix contributors"]

# ──────────────────────────────────────────────
# Harnix's own crates
#
# The dependency direction is one-way and each layer is ignorant of the one
# above it; `tests/layering.rs` asserts it rather than leaving it to review.
#
#   app ─→ transport ─→ authz ─┐
#     └───→ builtin ──→ hub ────┴─→ contract        (pure types, no deps)
#                        └────→ assembly → Agix
#                        └────→ contrib ← plugin
# ──────────────────────────────────────────────
[workspace.dependencies]
harnix-assembly  = { path = "crates/assembly" }
harnix-authz     = { path = "crates/authz" }
harnix-builtin   = { path = "crates/builtin" }
harnix-contract  = { path = "crates/contract" }
harnix-contrib   = { path = "crates/contrib" }
harnix-hub       = { path = "crates/hub" }
harnix-transport = { path = "crates/transport" }

# ──────────────────────────────────────────────
# Agix (submodule at agix/)
#
# The engine is linked in-process, so its crates are absorbed as members of
# *this* workspace and their `xxx = { workspace = true }` resolves against the
# table below — which therefore mirrors Agix's own. Agix adding a
# dependency means adding it here too.
#
# `daemon` keeps its default features: the default is the QuickJS script
# carrier (~1 MB), and the plugin carrier (wasmtime, ~20 MB) is deliberately
# not built. The two are mutually exclusive upstream — `daemon/src/lib.rs`
# refuses a build carrying both — so this is a choice, not an omission.
# Extension execution is Agix's; Harnix links no interpreter of its own.
# ──────────────────────────────────────────────
daemon      = { path = "agix/daemon" }
base        = { path = "agix/crates/core" }
model       = { path = "agix/crates/model" }
auth        = { path = "agix/crates/auth" }
hooks       = { path = "agix/crates/hooks" }
plugin      = { path = "agix/crates/plugin" }
plugin-host = { path = "agix/crates/plugin-host", default-features = false }
wasm-host   = { path = "agix/crates/wasm-host", default-features = false }
script-host = { path = "agix/crates/script-host" }
telemetry   = { path = "agix/crates/telemetry" }
history     = { path = "agix/crates/history" }
permissions = { path = "agix/crates/permissions" }
mcp         = { path = "agix/crates/mcp" }
tools       = { path = "agix/crates/tools" }
skills      = { path = "agix/crates/skills" }
runtime     = { path = "agix/crates/runtime" }
compaction  = { path = "agix/crates/compaction" }
session     = { path = "agix/crates/session" }
scene       = { path = "agix/crates/scene" }
team        = { path = "agix/crates/team" }
task        = { path = "agix/crates/task" }

# ──────────────────────────────────────────────
# Third-party — mirrors Agix's table (see above).
# ──────────────────────────────────────────────
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
process-wrap = { version = "9", default-features = false, features = ["tokio1", "process-group", "kill-on-drop"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
eventsource-stream = "0.2"
bytes = "1"
url = "2"
axum = { version = "0.8", features = ["ws"] }
# TLS for the listener. rustls is already in the graph via reqwest, so the
# marginal cost against the binary-size budget is small.
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# Signature verification for device challenge-response. Already in the graph
# under rustls, so this declares what is linked rather than adding to it.
ring = "0.17"
include_dir = "0.7"

# WebSocket
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }

# Serialize
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
unicode-normalization = "0.1"

# Errors / logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Common
uuid = { version = "1", features = ["v4", "serde"] }
semver = "1"
jsonschema = { version = "0.49", default-features = false }
rquickjs = { version = "0.12", default-features = false, features = ["std"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
sha2 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
libc = "0.2"
regex = "1"
glob = "0.3"
globset = "0.4"
html2text = "0.6"
which = "7"
similar = "2"
base64 = "0.22"
ignore = "0.4"
walkdir = "2"
tiktoken-rs = "0.6"
toml = "0.8"
bs58 = "0.5"
async-stream = "0.3"

# MCP
rmcp = { version = "1.6", features = ["client", "transport-child-process", "client-side-sse", "transport-streamable-http-client", "transport-streamable-http-client-reqwest"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Dev
tempfile = "3"
notify = "6"

# Mirrors Agix's release profile — see its Cargo.toml for why `panic`
# stays `unwind` and `lto` stays `thin`. The binary-size budget in
# docs/concept_and_architecture.md §7.2 is measured against this profile.
[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
