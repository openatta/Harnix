# An application on Harnix (docs/harnix-sdk.md §3).
#
# `harnix/` is the one submodule, and it brings the engine (`harnix/agix`).
# Harnix's crates are members of *this* workspace, so they resolve their
# dependencies against the table below; the engine's crates resolve against
# its own Cargo.toml, which is why `harnix/agix` is excluded rather than a
# member (design §11.2).
[workspace]
resolver = "2"
members = ["app", "harnix/crates/*"]
exclude = ["harnix/agix", "harnix/crates/testapp"]

[workspace.dependencies]
# BEGIN harnix — generated by harnix/scripts/sync-app-deps.mjs; do not edit
# END harnix
# Your own dependencies go below the block.

# A profile only applies at the workspace root. Agix's release profile —
# `panic` stays `unwind` (a panicking tool must not take the process down),
# `lto` stays `thin` for build time.
[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
