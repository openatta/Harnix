# The desktop shell: a window around a Harnix app (concept §5.11).
#
# Its own workspace, on purpose. The shell links Tauri and the platform's
# webview, the app links Agix; neither needs the other's dependency tree, and
# an app that puts this directory under its own tree should not find Tauri
# resolved against its workspace table (or Agix against this one).
[workspace]

[package]
name = "harnix-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "Apache-2.0"
publish = false
description = "A Tauri 2 window around a Harnix app: local (child process) or remote"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
# No plugins. Tray, window, notification, updater, single-instance and log
# would be fine — add them when the app wants them, Rust side only; none of
# them carries the app's traffic.
tauri = { version = "=2.12.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
dirs = "7"
# The shell as a client of its own child (ipdrun-43): the launch link, and whatever the app's shell
# asks for itself — a notification, a badge, a native picker's answer. Harnix's light client: the
# contract and std, no server, no runtime. An app's copy points this at its own `harnix/` checkout.
harnix-client = { path = "../../../crates/client" }

[target.'cfg(target_os = "macos")'.dependencies]
# Measuring the system's traffic lights before the window is made (main.rs):
# Tauri places them only at creation, and their size differs between macOS
# versions. The same versions Tauri already links.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSView", "NSControl", "NSButton", "NSWindow", "NSGraphics"] }

[target.'cfg(unix)'.dependencies]
# SIGINT for the child: the signal a Harnix process shuts down cleanly on.
libc = "0.2"
# The shell's own SIGINT/SIGTERM/SIGHUP, turned into an orderly exit that
# takes the child with it.
signal-hook = "0.4"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
