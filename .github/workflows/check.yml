# The layers of `scripts/check.sh` that need nothing this runner cannot have.
#
# Each step is one layer, run by the script itself (`--only <layer>`), so the
# crates, features and suites are the ones a local run checks and cannot drift
# from it: a list kept here went stale once already.
#
# No model, no `.env`, no secrets, no reachable network: so no `live`, no
# `interface` (topology parity) and no `remote`. Those are the layers
# `scripts/check.sh` reports as skipped on a machine without them, and the same
# honesty applies here — a green tick on this workflow means the deterministic
# layers passed, not that everything did. The strict replay of the recordings
# made on a real model (`api/strict-replay.spec.ts`) runs on macOS alone; on
# this Linux runner it skips itself.

name: check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          # Agix is a submodule and the whole product is assembled from
          # it — without this there is nothing to build.
          submodules: recursive

      # A full run builds a few tens of gigabytes; `check.sh` refuses to start
      # with less than 15 GB free, and the runner's image comes with less.
      - name: Make room
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h .

      # `wasm32-wasip2`: the packages' components, the scaffold `harnix-pack new` makes, and the
      # `harnix-wasm` fixtures are built for it.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4

      - name: build — the interface, the shipped binary, the packing tool, the example application
        run: scripts/check.sh --only build

      - name: rust — unit tests, layering and contracts, the flow library copied out
        run: scripts/check.sh --only rust

      - name: clippy — zero warnings on Harnix's crates
        run: scripts/check.sh --only clippy

      - name: offline — metadata, style, README pairing, recordings, UI layering, desktop template
        run: scripts/check.sh --only offline

      - name: frontend — typecheck, unit tests, protocol types, coverage table
        run: scripts/check.sh --only frontend

      - name: api — LIVE API suites, both topologies and the process carrier, replayed
        run: scripts/check.sh --only api

      - name: template — the application template, built offline from a clean copy
        run: scripts/check.sh --only template

      - name: Install chromium
        run: pnpm --filter @harnix/live-tests exec playwright install --with-deps chromium

      - name: browser — LIVE interface suites, both topologies and the process carrier
        run: scripts/check.sh --only browser

      # Latency and memory, measured last and alone — a shared runner makes
      # the numbers noisy, so this reports rather than gates.
      - name: budget
        run: scripts/check.sh --only budget
        continue-on-error: true
