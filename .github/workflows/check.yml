# The layers that need nothing this runner cannot have.
#
# No model, no `.env`, no reachable network: so no `--live`, no topology
# parity, and no `remote-smoke`. Those three are the ones `scripts/check.sh`
# reports as skipped on a machine without them, and the same honesty applies
# here — a green tick on this workflow means the deterministic layers passed,
# not that everything did.
#
# What is covered: the dependency-graph assertions, every unit test, clippy at
# zero warnings on Harnix's own crates, the offline interface checks, the whole
# API surface over both topologies against recorded fixtures, the browser
# layer, and a package installed end to end on the shipped binary.

name: check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # Agix is a submodule and the whole product is assembled from
          # it — without this there is nothing to build.
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4

      # The binary embeds the built interface and will not build without it.
      - name: Build the interface
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @harnix/shell build

      - name: Build the shipped binary
        run: cargo build --release -p harnix -p harnix-testapp

      - name: Unit tests and layering assertions
        run: |
          cargo test -p harnix -p harnix-app -p harnix-instance -p harnix-authz -p harnix-builtin \
                     -p harnix-contract -p harnix-module -p harnix-hub -p harnix-transport \
                     -p harnix-testapp

      # `--no-deps` so the Agix submodule's own lints are not this
      # repository's to answer for.
      - name: Clippy, zero warnings on Harnix's crates
        run: |
          cargo clippy -p harnix -p harnix-app -p harnix-instance -p harnix-authz -p harnix-builtin \
                       -p harnix-contract -p harnix-module -p harnix-hub -p harnix-transport \
                       -p harnix-testapp \
                       --all-targets --no-deps -- -D warnings

      - name: Interface checks that need no backend
        run: |
          node tests/style-lint.mjs
          node tests/readme-pairing.mjs
          node tests/app-scripts.mjs

      - name: The application template, built offline from a clean copy
        run: node tests/app-template.mjs

      - name: Front-end packages, protocol types, coverage table
        run: |
          pnpm -r --if-present run typecheck
          pnpm -r --if-present run test
          HARNIX_TS_OUT="$RUNNER_TEMP/ts" cargo test -q -p harnix-contract --features ts --test ts_export
          diff -u ui/packages/core/src/protocol/generated/contract.ts "$RUNNER_TEMP/ts/contract.ts"
          node tests/live/coverage.mjs --check

      - name: The API, both topologies, against recorded fixtures
        env:
          HARNIX_BIN: ${{ github.workspace }}/target/release/harnix
        run: |
          node tests/live/run.mjs --project api --topology single_duplex
          node tests/live/run.mjs --project api --topology split_streams

      - name: Install chromium
        run: pnpm --filter @harnix/live-tests exec playwright install --with-deps chromium

      - name: The interface, both topologies
        env:
          HARNIX_BIN: ${{ github.workspace }}/target/release/harnix
        run: |
          node tests/live/run.mjs --project ui --topology single_duplex
          node tests/live/run.mjs --project ui --topology split_streams

      - name: A package, from zip to what the interface does with it
        run: node tests/package-e2e.mjs

      # Latency and memory, measured last and alone — a shared runner makes
      # the numbers noisy, so this reports rather than gates.
      - name: Budget
        run: node tests/budget.mjs
        continue-on-error: true
