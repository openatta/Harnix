[package]
name = "showcase-tools"
version = "0.1.0"
edition = "2021"
publish = false

# Its own workspace: it builds for wasm32-wasip2, and the Harnix workspace builds for the host.
# rustc's wasip2 linker turns the cdylib into a component; nothing else is needed but the target
# (`rustup target add wasm32-wasip2`).
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.48"
serde_json = "1"

[profile.release]
opt-level = "s"
strip = true
lto = true
