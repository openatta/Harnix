# What the product is called and where its own state lives (~/.hello-app): the shell takes its
# name and icon from here, its colours and words from the interface module (ui/src/index.tsx).
# Its directory in each project is `.hello-app/` and the engine calls itself Hello: `project_dir`
# and `product_name` would say otherwise.
[brand]
name = "Hello"
icon = "brand.svg"
product_id = "hello-app"

[engine]
scene = "harnix"

[transport]
topologies = ["single_duplex", "split_streams"]
host = "127.0.0.1"
port = 4090
