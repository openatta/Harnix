# The example application (docs/harnix-sdk.md §3, roadmap M5-7), laid out as an application is:
# `harnix/` and `agix/` beside it — here links into this checkout.
#
# `harnix/` and `agix/` are submodules side by side. Harnix's crates are
# members of *this* workspace, so they resolve their dependencies against the
# table below; Agix's crates resolve against Agix's own Cargo.toml, which is
# why `agix` is excluded rather than a member (design §11.2).
[workspace]
resolver = "2"
members = ["app", "harnix/crates/*"]
exclude = ["agix", "harnix/agix", "harnix/crates/testapp"]

[workspace.dependencies]
# BEGIN harnix — generated by harnix/scripts/sync-app-deps.mjs; do not edit
harnix           = { path = "harnix/crates/harnix" }
harnix-app       = { path = "harnix/crates/app" }
harnix-instance  = { path = "harnix/crates/instance" }
harnix-authz     = { path = "harnix/crates/authz" }
harnix-builtin   = { path = "harnix/crates/builtin" }
harnix-contract  = { path = "harnix/crates/contract" }
harnix-module    = { path = "harnix/crates/module" }
harnix-hub       = { path = "harnix/crates/hub" }
harnix-transport = { path = "harnix/crates/transport" }
daemon    = { path = "agix/daemon" }
base      = { path = "agix/crates/core" }
model     = { path = "agix/crates/model" }
history   = { path = "agix/crates/history" }
scene     = { path = "agix/crates/scene" }
telemetry = { path = "agix/crates/telemetry" }
runtime   = { path = "agix/crates/runtime" }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
bytes = "1"
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
ring = "0.17"
include_dir = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
ignore = "0.4"
toml = "0.8"
clap = { version = "4", features = ["derive", "string"] }
tempfile = "3"
ts-rs = { version = "12", default-features = false, features = ["serde-compat"] }
# END harnix
# Your own dependencies go below the block.

# A profile only applies at the workspace root. Agix's release profile —
# `panic` stays `unwind` (a panicking tool must not take the process down),
# `lto` stays `thin` for build time.
[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
