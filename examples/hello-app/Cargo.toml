# The example application (docs/harnix-ext.md §3), laid out as an application is:
# `harnix/` beside it — here a link to this checkout.
#
# `harnix/` is the one submodule, and it brings the engine (`harnix/agix`).
# Harnix's crates are members of *this* workspace, so they resolve their
# dependencies against the table below; the engine's crates resolve against
# its own Cargo.toml, which is why `harnix/agix` is excluded rather than a
# member.
[workspace]
resolver = "2"
members = ["app", "harnix/crates/*", "harnix/crates/ext/*", "harnix/crates/carrier/*"]
exclude = ["harnix/agix", "harnix/crates/ext", "harnix/crates/carrier", "harnix/crates/testapp"]

[workspace.dependencies]
# BEGIN harnix — generated by harnix/scripts/sync-app-deps.mjs; do not edit
harnix           = { path = "harnix/crates/harnix" }
harnix-assembly  = { path = "harnix/crates/assembly" }
harnix-wasm-host = { path = "harnix/crates/wasm-host" }
harnix-package   = { path = "harnix/crates/package" }
harnix-proc      = { path = "harnix/crates/proc" }
harnix-wasm-port = { path = "harnix/crates/wasm-port" }
harnix-carrier-shared = { path = "harnix/crates/carrier/shared" }
harnix-carrier-wasm = { path = "harnix/crates/carrier/wasm" }
harnix-carrier-proc = { path = "harnix/crates/carrier/proc" }
harnix-instance  = { path = "harnix/crates/instance" }
harnix-supervise = { path = "harnix/crates/supervise" }
harnix-authz     = { path = "harnix/crates/authz" }
harnix-client    = { path = "harnix/crates/client" }
harnix-contract  = { path = "harnix/crates/contract" }
harnix-engine    = { path = "harnix/crates/engine" }
harnix-engine-api = { path = "harnix/crates/engine-api" }
harnix-engine-link = { path = "harnix/crates/engine-link" }
harnix-ext       = { path = "harnix/crates/ext/api" }
harnix-ext-devices = { path = "harnix/crates/ext/devices" }
harnix-ext-flow    = { path = "harnix/crates/ext/flow" }
harnix-ext-harnix-app = { path = "harnix/crates/ext/harnix-app" }
harnix-ext-observability = { path = "harnix/crates/ext/observability" }
harnix-ext-packages = { path = "harnix/crates/ext/packages" }
harnix-ext-plugins = { path = "harnix/crates/ext/plugins" }
harnix-ext-schedule = { path = "harnix/crates/ext/schedule" }
harnix-ext-settings = { path = "harnix/crates/ext/settings" }
harnix-ext-system  = { path = "harnix/crates/ext/system" }
harnix-host-api  = { path = "harnix/crates/host-api" }
harnix-hub       = { path = "harnix/crates/hub" }
harnix-kernel    = { path = "harnix/crates/kernel" }
harnix-router    = { path = "harnix/crates/router" }
harnix-transport = { path = "harnix/crates/transport" }
harnix-wasm      = { path = "harnix/crates/wasm" }
agix = { path = "harnix/agix/crates/agix", default-features = false, features = ["mcp", "agents", "skills", "web", "structured-output", "ptc", "scripts", "plugin-packages", "sandbox"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
url = "2.5"
bytes = "1"
http = "1"
http-body-util = "0.1"
tower = { version = "0.5", default-features = false, features = ["util"] }
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
ring = "0.17"
include_dir = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
libc = "0.2"
base64 = "0.22"
ignore = "0.4"
toml = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
clap = { version = "4", features = ["derive", "string"] }
tempfile = "3"
ts-rs = { version = "12", default-features = false, features = ["serde-compat"] }
# END harnix
# Your own dependencies go below the block.

# A profile only applies at the workspace root. Agix's release profile —
# `panic` stays `unwind` (a panicking tool must not take the process down),
# `lto` stays `thin` for build time.
[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
