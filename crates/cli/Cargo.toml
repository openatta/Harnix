[package]
name = "harnix-cli"
version      = "0.4.2-2026110901"
edition      = "2021"
rust-version = "1.87"
license      = "Apache-2.0"
publish      = false
description  = "The Harnix app, `harnix`: the built-ins and the flow module (xops-02 §6)"

# The binary lives here, not in `crates/harnix`, so an application that depends on the `harnix`
# library does not compile `harnix-ext-flow` for a binary it never builds (`tests/layering.rs`).
[[bin]]
name = "harnix"
path = "src/main.rs"

[dependencies]
harnix      = { workspace = true, features = ["flow"] }
harnix-ext-flow = { workspace = true }
anyhow      = { workspace = true }


[features]
default = []
# `cargo build -p harnix-cli --features apps`: a `harnix` that can host runtime applications.
# Its own target directory keeps the default build's untouched (scripts/check.sh).
apps = ["harnix/apps"]

[dev-dependencies]
# `harnix::testing::describe`: the route table this binary serves, pinned by `tests/method_table.rs`.
harnix = { workspace = true, features = ["testing"] }
serde_json = { workspace = true }
