name: example-review
title: "Example: review and approve"
description: >-
  A session reviews the subject and lists what it finds; a person approves, or sends it back.
  Built into the empty application: save a changed copy and it overrides this one.
stations:
  - id: review
    title: Review
    executor: {kind: session, scene: flow-chat}
    skill: review
    output:
      type: object
      required: [summary, findings]
      properties:
        summary: {type: string}
        findings:
          type: array
          items:
            type: object
            required: [severity, text]
            properties:
              severity: {enum: [high, medium, low]}
              text: {type: string}
    exit: [{kind: output}]
  - id: approve
    title: Approve
    exit: [{kind: confirm}]
    rework_to: [review]
