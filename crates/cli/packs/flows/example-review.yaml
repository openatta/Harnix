name: example-review
title: "Example: review and approve"
description: >-
  The run's main Agent reviews the subject and lists what it finds; a person approves, or sends
  it back. Built into the Harnix app: save a changed copy and it overrides this one.
stations:
  - id: review
    title: Review
    executor: {kind: session}   # no scene: a turn of the run's main session
    skill: review
    rules: [review-honest]      # told to the session, never enforced
    policies: [read-only]       # each tool call is judged against its permissions
    output:
      type: object
      required: [summary, findings]
      properties:
        summary: {type: string}
        findings:
          type: array
          items:
            type: object
            required: [severity, text]
            properties:
              severity: {enum: [high, medium, low]}
              text: {type: string}
    exit: [{kind: output}]
  - id: approve
    title: Approve
    exit: [{kind: confirm}]
    rework_to: [review]
