[package]
name = "harnix-module"
version      = "0.4.2-2026110901"
edition      = "2021"
rust-version = "1.87"
license      = "Apache-2.0"
publish      = false
description  = "The compile-time module contract, as a layer over the extension interface while the built-ins move onto it"

[dependencies]
harnix-contract = { workspace = true }
harnix-authz    = { workspace = true }
harnix-kernel   = { workspace = true }
harnix-instance = { workspace = true }
harnix-engine-api = { workspace = true }
harnix-ext        = { workspace = true, features = ["axum"] }
async-trait = { workspace = true }
anyhow      = { workspace = true }
axum        = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
tokio       = { workspace = true }
toml        = { workspace = true }
