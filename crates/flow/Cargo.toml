[package]
name = "harnix-flow"
version      = "0.4.5-2026111601"
edition      = "2021"
rust-version = "1.88"
license      = "Apache-2.0"
publish      = false
description  = "The flow library: definitions, run records, the kernel that moves a run through its stations, stores and packs"

[lib]
name = "harnix_flow"

# Every version is written here rather than taken from the workspace (`workspace = true`): the
# directory is copied whole into other workspaces (docs/embed.en.md), where an inherited one would
# be theirs or missing. Where Harnix's workspace names the same crate the two agree
# (`tests/crate-metadata.mjs`); `tests/deps.rs` keeps Harnix and Agix out.

[features]
default = ["runner", "webhooks"]
# The runner: carrying a run's work out in sessions a host provides (`runner::SessionHost`),
# gates, hooks, worktrees. Off, the crate is the kernel alone.
runner = ["dep:tokio-util", "dep:futures", "tokio/time", "tokio/process", "tokio/macros", "tokio/io-util"]
# The hooks' webhooks delivered over HTTP (`reqwest`); off, a host gives its own `HookTransport`.
webhooks = ["runner", "dep:reqwest"]
# TypeScript declarations of the definitions and run records, generated by the host
# (Harnix: `crates/harnix/tests/ts_export.rs`). Off in every build that ships.
ts = ["dep:ts-rs"]

[dependencies]
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
async-trait = "0.1"
sha2        = "0.10"
uuid        = { version = "1", features = ["v4"] }
# No longer maintained upstream; kept until a replacement reads the same YAML.
serde_yaml  = "0.9"
schemars    = "1"
jsonschema  = { version = "0.49", default-features = false }
# FileStore's disk work on the blocking pool; the dry runs' lock.
tokio       = { version = "1", features = ["rt", "sync"] }
# What the file store skips, said rather than swallowed.
tracing     = "0.1"
# The file store's flush to disk (`fsync`) on macOS; the local date of an output directory's name.
libc        = "0.2"
# The runner's tasks, tracked and told to stop.
tokio-util  = { version = "0.7", features = ["rt"], optional = true }
# A session read as a stream of frames.
futures     = { version = "0.3", optional = true }
# Webhooks (feature `webhooks`).
reqwest     = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
ts-rs       = { version = "12", default-features = false, features = ["serde-compat"], optional = true }

[dev-dependencies]
tempfile = "3"
# `#[tokio::test]`, and paused time.
tokio    = { version = "1", features = ["rt", "macros", "test-util"] }
# `tests/surface.rs` reads the public surface off the parsed source.
syn      = { version = "2", features = ["full"] }
quote    = "1"
