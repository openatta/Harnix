[package]
name = "harnix-flow"
version      = "0.4.0-2026102801"
edition      = "2021"
rust-version = "1.87"
license      = "Apache-2.0"
publish      = false
description  = "Flows: a graph of stations that drives session work, judged on structured signals only"

[lib]
name = "harnix_flow"

[features]
# The Harnix module (`Flow`): sessions, programs, native tools, methods, topics. Off, the crate is
# the pure kernel with its stores and packs and links nothing of Harnix or Agix.
default = ["module"]
module  = ["dep:harnix-module", "dep:harnix-contract", "dep:base", "dep:tracing", "dep:anyhow"]

[dependencies]
serde       = { workspace = true }
serde_json  = { workspace = true }
async-trait = { workspace = true }
sha2        = { workspace = true }
uuid        = { workspace = true }
serde_yaml  = "0.9"
schemars    = "1"
jsonschema  = { version = "0.49", default-features = false }
# FileStore's disk work on the blocking pool; the module's tasks and timers.
tokio       = { workspace = true }
harnix-module   = { workspace = true, optional = true }
harnix-contract = { workspace = true, optional = true }
base            = { workspace = true, optional = true }
tracing         = { workspace = true, optional = true }
anyhow          = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
