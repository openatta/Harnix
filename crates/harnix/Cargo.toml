[package]
name = "harnix"
version      = "0.4.2-2026110901"
edition      = "2021"
rust-version = "1.87"
license      = "Apache-2.0"
publish      = false
description  = "Agix, assembled into a product — the crate an application depends on"

[lib]
path = "src/lib.rs"

# The Harnix app's binary, `harnix`, is `crates/cli` (`harnix-cli`): it registers the
# flow module, which a library user must not be made to compile (xops-02 §6).

[features]
default = []
# Runtime applications (`harnix-app`'s `apps`): see crates/app/Cargo.toml.
apps = ["harnix-app/apps"]

[dependencies]
harnix-app       = { workspace = true }
harnix-module    = { workspace = true }
harnix-contract  = { workspace = true }
harnix-authz     = { workspace = true }
# The engine's interfaces, re-exported as `harnix::agent`, `harnix::scenes` and `harnix::plugin`:
# an application names only this crate.
base        = { workspace = true }
scene       = { workspace = true }
# Agix's Rust plugin (`runtime::plugin`), re-exported as `harnix::plugin`: what
# `EngineContrib::plugin` takes.
runtime     = { workspace = true }
async-trait = { workspace = true }
anyhow      = { workspace = true }
axum        = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
