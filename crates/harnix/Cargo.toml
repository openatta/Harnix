[package]
name = "harnix"
version      = "0.4.5-2026111601"
edition      = "2021"
rust-version = "1.88"
license      = "Apache-2.0"
publish      = false
description  = "Agix, assembled into a product — the crate an application depends on"

[lib]
path = "src/lib.rs"

# The Harnix app's binary, `harnix`, is `crates/cli` (`harnix-cli`): it registers the
# flow module, which a library user must not be made to compile (xops-02 §6).

[features]
default = ["first-party"]
# `harnix::first_party`: Harnix's own extensions, each granted what Harnix grants it.
# `harnix::first_party::flow`: the flow extension. Off unless asked for: the Harnix app asks.
flow = ["first-party", "dep:harnix-ext-flow"]
# `harnix::first_party::Schedules`: schedules Harnix runs — turns, new sessions, tasks at set times.
# Off unless asked for: the Harnix app asks.
schedule = ["first-party", "dep:harnix-ext-schedule"]
first-party = [
    "dep:harnix-ext-harnix-app",
    "dep:harnix-ext-observability",
    "dep:harnix-ext-settings",
    "dep:harnix-ext-plugins",
    "dep:harnix-ext-devices",
]
# Packages in this process (mode 2): `harnix::first_party::packages()`, the component that installs
# packages and registers each as an extension, on the WebAssembly carrier, whose engine it links.
wasm = ["first-party", "dep:harnix-ext-packages", "dep:harnix-carrier-wasm"]
# Packages in processes of their own (mode 3): `harnix::first_party::packages()` can also run each
# package in an extension process (`[ext.packages] carrier = "process"`), and `App::builder()`
# registers `ext-proc`, the subcommand this binary is re-executed as for one. With `wasm` too,
# both carriers are linked and the profile picks; unset, `wasm`.
proc = ["first-party", "dep:harnix-ext-packages", "dep:harnix-carrier-proc", "dep:harnix-proc"]
# `<product> ext-proc --probe`: what the process's sandbox lets it reach, for tests. Never in a
# product's build.
proc-probe = ["proc", "harnix-proc/probe"]
# `harnix::testing`: a product's route table without starting it, and a process started without
# its listener. Not stable.
testing = []
# `harnix::ext::http::axum`: an `axum::Router` as an extension's route, and `harnix::axum`, the crate
# it takes it from. Not stable: bound to axum's major version.
axum = ["harnix-ext/axum", "dep:axum"]
# `tests/ts_export.rs`: the interface's protocol declarations, generated from the Rust types that
# serialize onto the wire — the kernel's (`harnix_contract::wire`), the readers', the packages', the
# flows', the settings' MCP methods', the schedules'. It reaches every crate whose types are
# declared there, so it is only ever a test's feature.
ts = ["dep:ts-rs", "harnix-ext/ts", "harnix-ext-packages/ts", "harnix-ext-flow/ts", "harnix-ext-settings/ts", "harnix-ext-schedule/ts"]

[dependencies]
harnix-assembly       = { workspace = true }
# The extension interface, re-exported as `harnix::ext`, with the engine interface as `harnix::engine`
# and the contract's S1 types at the root: every re-export here is one of these two crates' (l24).
harnix-ext       = { workspace = true }
# Harnix's own extensions (`first-party`).
harnix-ext-harnix-app    = { workspace = true, optional = true }
harnix-ext-flow          = { workspace = true, optional = true }
harnix-ext-schedule      = { workspace = true, optional = true }
harnix-ext-observability = { workspace = true, optional = true }
harnix-ext-settings      = { workspace = true, optional = true }
harnix-ext-plugins       = { workspace = true, optional = true }
harnix-ext-devices       = { workspace = true, optional = true }
# Packages (`wasm`): the host component, and the carrier that runs them in this process.
harnix-ext-packages      = { workspace = true, optional = true }
harnix-carrier-wasm      = { workspace = true, optional = true }
# Packages in processes of their own (`proc`): the carrier, beside the process's code below.
harnix-carrier-proc      = { workspace = true, optional = true }
# The extension process's code (`proc`).
harnix-proc       = { workspace = true, optional = true }
async-trait = { workspace = true }
anyhow      = { workspace = true }
axum        = { workspace = true, optional = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
ts-rs       = { workspace = true, optional = true }

[dev-dependencies]
# `tests/tool_names.rs` holds the host's copy of the tool-naming rule to the package crate's.
harnix-package = { workspace = true }
# `tests/ts_export.rs` declares the kernel's wire shapes (`harnix_contract::wire`) for the interface.
harnix-contract = { workspace = true }
