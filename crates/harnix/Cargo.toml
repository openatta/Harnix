[package]
name = "harnix"
version      = "0.4.0-2026102801"
edition      = "2021"
rust-version = "1.87"
license      = "Apache-2.0"
publish      = false
description  = "Agix, assembled into a product — the crate an application depends on"

[lib]
path = "src/lib.rs"

# The empty application's binary, `harnix`, is `crates/cli` (`harnix-cli`): it registers the
# flow module, which a library user must not be made to compile (xops-02 §6).

[dependencies]
harnix-app       = { workspace = true }
harnix-module    = { workspace = true }
harnix-contract  = { workspace = true }
harnix-authz     = { workspace = true }
async-trait = { workspace = true }
anyhow      = { workspace = true }
axum        = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
