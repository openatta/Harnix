[package]
name = "harnix-ext-harnix-app"
version      = "0.4.4-2026111502"
edition      = "2021"
rust-version = "1.88"
license      = "Apache-2.0"
publish      = false
description  = "The Harnix app: the session space, workspaces, archive, export, search, the project picker"

[lib]
name = "harnix_ext_harnix_app"

[dependencies]
harnix-ext  = { workspace = true }
async-trait = { workspace = true }
anyhow      = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
tokio       = { workspace = true }
tracing     = { workspace = true }
uuid        = { workspace = true }
# An archive's zip, carried in the answer.
base64      = { workspace = true }
# The `@` file menu walks a project as git would: what .gitignore leaves out is not offered.
ignore      = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
