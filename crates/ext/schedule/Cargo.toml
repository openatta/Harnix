[package]
name = "harnix-ext-schedule"
version      = "0.4.5-2026111601"
edition      = "2021"
rust-version = "1.88"
license      = "Apache-2.0"
publish      = false
description  = "Schedules: turns, new sessions and project tasks started at set times, run by Harnix"

[lib]
name = "harnix_ext_schedule"

[features]
# TypeScript declarations of the rows and params (`@harnix/core`), generated by
# `crates/harnix/tests/ts_export.rs`. Off in every build that ships.
ts = ["dep:ts-rs"]

[dependencies]
harnix-ext  = { workspace = true }
async-trait = { workspace = true }
anyhow      = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
# The timer, the lock deliveries take one at a time.
tokio       = { workspace = true }
# What the store and the runner skip, said rather than swallowed.
tracing     = { workspace = true }
# v5: a new session's id derived from its schedule and time.
uuid        = { workspace = true, features = ["v5"] }
# Wall-clock times in an IANA zone, across daylight-saving changes: read from the system's tz
# database (bundled on Windows only), no further dependency on Unix.
jiff        = "0.2"
ts-rs       = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio    = { workspace = true, features = ["test-util"] }
