[package]
name = "harnix-ext"
version      = "0.4.3-2026111501"
edition      = "2021"
rust-version = "1.88"
license      = "Apache-2.0"
publish      = false
description  = "The extension interface: Extension, its Registrar and descriptor, ExtensionContext"

[dependencies]
harnix-contract   = { workspace = true }
harnix-engine-api = { workspace = true }
# Only inside the private `internal` module: what the extension host hands an extension's
# declarations when it seats them. No public signature here names it.
harnix-kernel     = { workspace = true }
async-trait    = { workspace = true }
anyhow         = { workspace = true }
bytes          = { workspace = true }
http           = { workspace = true }
http-body-util = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
tokio          = { workspace = true }
tracing        = { workspace = true }
axum           = { workspace = true, optional = true }
tower          = { workspace = true, optional = true }

[features]
default = []
# `harnix_ext::http::axum`: an `axum::Router` as an extension's route. Not stable: it is bound to
# axum's major version, which the routes themselves (`http` 1.x) are not.
axum = ["dep:axum", "dep:tower"]

[dev-dependencies]
# `tests/contract.rs` runs a test extension on `harnix::testing::Kernel`: the real router and hub.
harnix   = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }
