[package]
name = "harnix-ext-flow"
version      = "0.4.5-2026111601"
edition      = "2021"
rust-version = "1.88"
license      = "Apache-2.0"
publish      = false
description  = "Flows in Harnix: the extension that runs the flow library's runs in sessions, with its methods and topics"

[lib]
name = "harnix_ext_flow"

[features]
# TypeScript declarations of the definitions, run records and the module's rows (`@harnix/flow`),
# generated by `crates/harnix/tests/ts_export.rs`. Off in every build that ships.
ts = ["harnix-flow/ts", "dep:ts-rs"]

[dependencies]
# The library: definitions, run records, the kernel, stores and packs; re-exported whole.
harnix-flow = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
async-trait = { workspace = true }
sha2        = { workspace = true }
# A session id derived from its key (v5), so opening a run's session is idempotent.
uuid        = { workspace = true, features = ["v5"] }
serde_yaml  = "0.9"
# The module's tasks and timers.
tokio       = { workspace = true }
tracing     = { workspace = true }
# The local date in an output directory's name (`localtime_r`).
libc        = { workspace = true }
# The module's tasks, tracked and told to stop.
tokio-util  = { workspace = true }
# A session task reads its session as a stream of frames.
futures     = { workspace = true }
# The extension interface, and the scenes and tools it gives the engine in Harnix's words.
harnix-ext      = { workspace = true }
anyhow          = { workspace = true }
# Hooks' webhooks (xops-04 §5).
reqwest         = { workspace = true }
ts-rs           = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
# Paused time: a session task's waits run through in an instant.
tokio    = { workspace = true, features = ["test-util"] }
