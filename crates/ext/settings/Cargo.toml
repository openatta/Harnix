[package]
name = "harnix-ext-settings"
version      = "0.4.3-2026111501"
edition      = "2021"
rust-version = "1.88"
license      = "Apache-2.0"
publish      = false
description  = "Settings: the engine's three settings tiers and its providers, edited from the settings page"

[lib]
name = "harnix_ext_settings"

[dependencies]
harnix-ext  = { workspace = true }
# Where the engine's settings tiers are: a transitional host service, until the engine takes the
# global tier's writes over its protocol (docs/harnix-ext.md §17.8).
harnix-host-api = { workspace = true }
async-trait = { workspace = true }
libc        = { workspace = true }
serde_json  = { workspace = true }
tracing     = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
