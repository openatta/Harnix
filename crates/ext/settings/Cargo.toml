[package]
name = "harnix-ext-settings"
version      = "0.4.6-2026111701"
edition      = "2021"
rust-version = "1.88"
license      = "Apache-2.0"
publish      = false
description  = "Settings: the engine's three settings tiers and its providers, edited from the settings page"

[lib]
name = "harnix_ext_settings"

[dependencies]
harnix-ext  = { workspace = true }
# Where the engine's settings tiers are, for the page to name each tier's file: the engine reads and
# writes them over its protocol, and says no path until it has written one (docs/harnix-ext.md §17.8).
harnix-host-api = { workspace = true }
anyhow      = { workspace = true }
async-trait = { workspace = true }
http        = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
tokio       = { workspace = true }
tracing     = { workspace = true }
url         = { workspace = true }
ts-rs       = { workspace = true, optional = true }

[features]
# TypeScript declarations of the MCP methods' answers (`@harnix/core/protocol`), generated by
# `crates/harnix/tests/ts_export.rs`. Off in every build that ships.
ts = ["dep:ts-rs"]

