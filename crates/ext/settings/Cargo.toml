[package]
name = "harnix-ext-settings"
version      = "0.4.5-2026111601"
edition      = "2021"
rust-version = "1.88"
license      = "Apache-2.0"
publish      = false
description  = "Settings: the engine's three settings tiers and its providers, edited from the settings page"

[lib]
name = "harnix_ext_settings"

[dependencies]
harnix-ext  = { workspace = true }
# Where the engine's settings tiers are: a transitional host service, until the engine takes the
# tiers' writes over its protocol (docs/harnix-ext.md §17.8). Providers already go through it.
harnix-host-api = { workspace = true }
anyhow      = { workspace = true }
async-trait = { workspace = true }
http        = { workspace = true }
libc        = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
tokio       = { workspace = true }
tracing     = { workspace = true }
url         = { workspace = true }
ts-rs       = { workspace = true, optional = true }

[features]
# TypeScript declarations of the MCP methods' answers (`@harnix/core/protocol`), generated by
# `crates/harnix/tests/ts_export.rs`. Off in every build that ships.
ts = ["dep:ts-rs"]

[dev-dependencies]
tempfile = { workspace = true }
