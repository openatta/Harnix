[package]
name = "harnix-ext-system"
version      = "0.4.5-2026111601"
edition      = "2021"
rust-version = "1.88"
license      = "Apache-2.0"
publish      = false
description  = "The system space: looking into and acting on any instance's sessions, and the instances themselves"

[lib]
name = "harnix_ext_system"

# Only the extension interface: the system space is built from what any extension can reach.
[dependencies]
harnix-ext  = { workspace = true }
async-trait = { workspace = true }
serde_json  = { workspace = true }

