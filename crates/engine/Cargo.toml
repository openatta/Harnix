[package]
name = "harnix-engine"
version      = "0.4.2-2026110901"
edition      = "2021"
rust-version = "1.87"
license      = "Apache-2.0"
publish      = false
description  = "Agix, behind Harnix's engine interface: the one crate that links the engine"

[features]
default = []
# `harnix_engine::agix`: Agix's own types, for what the engine interface does not say. Not stable.
agix = []

[dependencies]
harnix-engine-api = { workspace = true }
daemon      = { workspace = true }
base        = { workspace = true }
model       = { workspace = true }
scene       = { workspace = true }
history     = { workspace = true }
telemetry   = { workspace = true }
runtime     = { workspace = true }
tokio       = { workspace = true }
tokio-util  = { workspace = true }
anyhow      = { workspace = true }
async-trait = { workspace = true }
tracing     = { workspace = true }
reqwest     = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }

[dev-dependencies]
tempfile    = { workspace = true }
