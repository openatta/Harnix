[package]
name = "harnix-engine-api"
version      = "0.4.5-2026111601"
edition      = "2021"
rust-version = "1.88"
license      = "Apache-2.0"
publish      = false
description  = "The engine in Harnix's words, as an extension gives to it and reads of it: tools, scenes, gates, templates and readers, with nothing of Agix in them"

[dependencies]
harnix-contract = { workspace = true }
async-trait = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
tokio       = { workspace = true }
tokio-util  = { workspace = true }
ts-rs       = { workspace = true, optional = true }

[features]
# TypeScript declarations of the readers' structures (`@harnix/core/protocol`), generated by
# `crates/harnix/tests/ts_export.rs`. Off in every build that ships.
ts = ["dep:ts-rs"]

[dev-dependencies]
tokio       = { workspace = true }
