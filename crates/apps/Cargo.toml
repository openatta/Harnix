[package]
name = "harnix-apps"
version      = "0.4.2-2026110901"
edition      = "2021"
rust-version = "1.87"
license      = "Apache-2.0"
publish      = false
description  = "Runtime applications embedded in the product's process: installing them, and their tools in every session"

# The embedded edition's glue, behind the `apps` built-in module (`harnix_builtin::apps::AppsRuntime`):
# the host's port over the kernel (registration, `module:<id>` calls, topics, the agent engine's
# instances), the Agix plugin that gives every session the running applications' tools, and the
# HTTP side (`/apps/<id>/ui`, `/apps/<id>/mcp`). The applications themselves run in
# `harnix-app-host`; their packages are `harnix-app-package`'s. Only a build with the `apps`
# feature links it (crates/app), and through it the host and `harnix-wasm`.
[dependencies]
harnix-app-host    = { workspace = true }
harnix-app-package = { workspace = true }
harnix-app-port    = { workspace = true }
harnix-builtin  = { workspace = true }
harnix-contract = { workspace = true }
harnix-module   = { workspace = true }
base        = { workspace = true }
runtime     = { workspace = true }
anyhow      = { workspace = true }
async-trait = { workspace = true }
axum        = { workspace = true }
serde_json  = { workspace = true }
tokio       = { workspace = true }
tokio-util  = { workspace = true }
toml        = { workspace = true }
tracing     = { workspace = true }
uuid        = { workspace = true }

[features]
default = []
# Its tests compile the showcase's component for this engine.
compile = ["harnix-app-host/compile"]

[dev-dependencies]
tempfile = { workspace = true }
hex      = { workspace = true }
zip      = { workspace = true }
