[package]
name = "harnix"
version      = "0.3.1-2026102501"
edition      = "2021"
rust-version = "1.87"
license      = "Apache-2.0"
publish      = false
description  = "Agix, assembled into a product: one binary, one process, one user"

[[bin]]
name = "harnix"
path = "src/main.rs"

[dependencies]
harnix-assembly  = { workspace = true }
harnix-authz     = { workspace = true }
harnix-builtin   = { workspace = true }
harnix-contract  = { workspace = true }
harnix-contrib   = { workspace = true }
harnix-hub       = { workspace = true }
harnix-transport = { workspace = true }
tokio       = { workspace = true }
async-trait = { workspace = true }
history     = { workspace = true }
base        = { workspace = true }
anyhow      = { workspace = true }
clap        = { workspace = true }
tracing     = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json  = { workspace = true }
uuid        = { workspace = true }
