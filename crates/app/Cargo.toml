[package]
name = "harnix-app"
version      = "0.4.1-2026110806"
edition      = "2021"
rust-version = "1.87"
license      = "Apache-2.0"
publish      = false
description  = "App::builder(): a Harnix process assembled from compile-time modules"

[dependencies]
harnix-instance  = { workspace = true }
harnix-authz     = { workspace = true }
harnix-builtin   = { workspace = true }
harnix-contract  = { workspace = true }
harnix-module    = { workspace = true }
harnix-hub       = { workspace = true }
harnix-transport = { workspace = true }
daemon      = { workspace = true }
tokio       = { workspace = true }
async-trait = { workspace = true }
history     = { workspace = true }
base        = { workspace = true }
anyhow      = { workspace = true }
clap        = { workspace = true }
tracing     = { workspace = true }
tracing-subscriber = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
toml        = { workspace = true }
uuid        = { workspace = true }
libc        = { workspace = true }
# Runtime applications' WebAssembly (`apps` below). Not in a default build: it brings the
# application runtime and its engine, which the binary-size budget measures separately.
harnix-apps = { workspace = true, optional = true }

[features]
default = []
# Host runtime applications: install a package, run its component, give sessions its tools
# (`[apps] enabled` in the profile still decides whether a process does).
apps = ["dep:harnix-apps"]

[dev-dependencies]
tempfile    = { workspace = true }
