[package]
name = "harnix-testapp"
version      = "0.4.1-2026110806"
edition      = "2021"
rust-version = "1.87"
license      = "Apache-2.0"
publish      = false
description  = "An application for the LIVE tests: modules that work, and modules that fail on purpose"

[[bin]]
name = "harnix-testapp"
path = "src/main.rs"

[dependencies]
harnix      = { workspace = true }
harnix-flow = { workspace = true }
anyhow      = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
tokio       = { workspace = true }
futures     = { workspace = true }

[features]
default = []
# `cargo build -p harnix-testapp --features apps`: this application hosting runtime applications,
# verified against the mock store's key (tests/live/fixtures/store) instead of the store's own.
apps = ["harnix/apps"]
