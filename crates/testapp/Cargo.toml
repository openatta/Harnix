[package]
name = "harnix-testapp"
version      = "0.4.0-2026102801"
edition      = "2021"
rust-version = "1.87"
license      = "Apache-2.0"
publish      = false
description  = "An application for the LIVE tests: modules that work, and modules that fail on purpose"

[[bin]]
name = "harnix-testapp"
path = "src/main.rs"

[dependencies]
harnix      = { workspace = true }
anyhow      = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
tokio       = { workspace = true }
futures     = { workspace = true }
# Agix, for the native contributions a template gives (a scene with a tool of its own, a prompt
# block): a module that writes those names Agix's types.
base        = { workspace = true }
scene       = { workspace = true }
