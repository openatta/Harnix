[package]
name = "harnix-contract"
version      = "0.4.0-2026102604"
edition      = "2021"
rust-version = "1.87"
license      = "Apache-2.0"
publish      = false
description  = "The types the kernel's four parts pass across each other's boundaries"

[dependencies]
async-trait = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
ts-rs       = { workspace = true, optional = true }

[features]
# TypeScript declarations for `@harnix/core/protocol`. Off in every build that
# ships: only `tests/ts_export.rs` turns it on, so ts-rs is never linked into
# the binary and costs the size budget nothing (design §4.2, §10.6).
ts = ["dep:ts-rs"]
