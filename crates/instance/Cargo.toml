[package]
name = "harnix-instance"
version      = "0.4.5-2026111601"
edition      = "2021"
rust-version = "1.88"
license      = "Apache-2.0"
publish      = false
description  = "Agix instances: built in-process or reached as a daemon, behind one link"

[dependencies]
harnix-contract = { workspace = true }
harnix-kernel   = { workspace = true }
harnix-supervise = { workspace = true }
harnix-engine   = { workspace = true }
harnix-engine-api = { workspace = true }
harnix-engine-link = { workspace = true }
tokio       = { workspace = true }
tokio-util  = { workspace = true }
anyhow      = { workspace = true }
tracing     = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
async-trait = { workspace = true }
reqwest     = { workspace = true }
toml        = { workspace = true }
libc        = { workspace = true }

[dev-dependencies]
tempfile    = { workspace = true }
# Agix's own settings loader, to see that what is written is what the engine reads.
harnix-engine = { workspace = true }
