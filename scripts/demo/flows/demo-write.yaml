name: demo-write
title: "示例：起草、评审、确认"
description: 主 Agent 起草，子 Agent 评审，人确认；确认不过就退回起草。
rules: [no-secrets, plain-chinese]
stations:
  - id: draft
    title: 起草
    executor: {kind: session}
    skill: draft
    policies: [drafts-only]
    output:
      type: object
      required: [summary]
      properties: {summary: {type: string}}
    exit: [{kind: output}, {kind: gate, gate: draft-exists}]
  - id: review
    title: 评审（子 Agent）
    executor: {kind: agent, description: 按评审清单检查起草的内容}
    skill: review
    rules: [cite-sources]
    policies: [read-only]
    output:
      type: object
      required: [findings]
      properties: {findings: {type: array, items: {type: string}}}
    exit: [{kind: output}]
  - id: sign
    title: 确认
    exit: [{kind: confirm}]
    rework_to: [draft]
